
<style>
*{box-sizing:border-box;margin:0;padding:0}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.phase-nav{display:flex;gap:0;margin-bottom:20px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);overflow:hidden}
.pn{flex:1;padding:8px 10px;font-size:11px;font-weight:500;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);border:none;border-right:0.5px solid var(--color-border-secondary);transition:all .15s;text-align:center;line-height:1.3}
.pn:last-child{border-right:none}
.pn.on{background:var(--color-text-primary);color:var(--color-background-primary)}
.section-intro{font-size:12px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:14px;padding:10px 14px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border-left:3px solid #534AB7;border-bottom-left-radius:0;border-top-left-radius:0}
.products{display:flex;flex-direction:column;gap:10px}
.prod{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;cursor:pointer;transition:border-color .15s}
.prod:hover{border-color:var(--color-border-secondary)}
.prod.open{border-color:#534AB7}
.prod-head{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:11px 14px;background:var(--color-background-secondary)}
.prod-name{font-size:13px;font-weight:500;color:var(--color-text-primary);line-height:1.3}
.prod-sub{font-size:11px;color:var(--color-text-secondary);margin-top:2px;font-weight:400}
.badges{display:flex;gap:4px;flex-direction:column;align-items:flex-end}
.badge{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:500;white-space:nowrap}
.b-green{background:#E1F5EE;color:#085041}
.b-purple{background:#EEEDFE;color:#3C3489}
.b-amber{background:#FAEEDA;color:#633806}
.b-coral{background:#FAECE7;color:#712B13}
.b-gray{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary)}
.chev{font-size:11px;color:var(--color-text-tertiary);transition:transform .2s}
.prod.open .chev{transform:rotate(180deg)}
.prod-body{display:none;padding:14px 14px;border-top:0.5px solid var(--color-border-tertiary)}
.prod.open .prod-body{display:block}
.body-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.body-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.box-label{font-size:10px;color:var(--color-text-tertiary);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.box-text{font-size:11px;color:var(--color-text-secondary);line-height:1.55}
.box-text li{margin-left:14px;margin-bottom:3px}
.joinville-box{background:#EEEDFE;border-radius:var(--border-radius-md);padding:10px 12px;margin-bottom:12px}
.jv-label{font-size:10px;color:#3C3489;font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.jv-text{font-size:11px;color:#3C3489;line-height:1.55}
.escalada-box{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;margin-bottom:12px}
.esc-label{font-size:10px;color:var(--color-text-tertiary);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.esc-steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.esc-step{font-size:11px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);background:var(--color-background-primary)}
.esc-arrow{font-size:12px;color:var(--color-text-tertiary)}
.esc-step.highlight{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.ask-btn{font-size:11px;padding:6px 14px;cursor:pointer;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary);width:100%;text-align:left}
.ask-btn:hover{background:var(--color-background-secondary)}
.meter-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.meter-label{font-size:11px;color:var(--color-text-secondary);width:110px;flex-shrink:0}
.meter-bar{flex:1;height:5px;background:var(--color-border-tertiary);border-radius:3px;overflow:hidden}
.meter-fill{height:100%;border-radius:3px}
.fill-purple{background:#534AB7}
.fill-teal{background:#1D9E75}
.fill-amber{background:#BA7517}
.meter-val{font-size:11px;color:var(--color-text-tertiary);width:28px;text-align:right}
</style>

  <button class="pn" data-p="2" onclick="showPhase(2)">Fase 3 — Mandato estratégico</button>
</div>
<div id="phase-intro" class="section-intro"></div>
<div class="products" id="products-list"></div>
</div>

let currentPhase=0;
let openProds=new Set();

function showPhase(idx){
  currentPhase=idx;
  openProds.clear();
  document.querySelectorAll(".pn").forEach((b,i)=>{b.classList.toggle("on",i===idx)});
  render();
}

function toggleProd(id){
  if(openProds.has(id)) openProds.delete(id); else openProds.add(id);
  render();
}

function scoreBar(val,fillClass){
  const pct=Math.round(val/5*100);
  return `<div class="meter-fill ${fillClass}" style="width:${pct}%"></div>`;
}

function render(){
  const phase=phases[currentPhase];
  document.getElementById("phase-intro").textContent=phase.intro;
  const list=document.getElementById("products-list");
  list.innerHTML=phase.products.map((p,i)=>{
    const id="p"+currentPhase+"-"+i;
    const isOpen=openProds.has(id);
    const steps=p.escalada.map((s,si)=>`<span class="esc-step${si===p.escaladaIdx?" highlight":""}">${s}</span>${si<p.escalada.length-1?'<span class="esc-arrow">→</span>':""}`).join("");
    const como=p.como.map(c=>`<li>${c}</li>`).join("");
    return `<div class="prod${isOpen?" open":""}" onclick="toggleProd('${id}')">
      <div class="prod-head">
        <div>
          <div class="prod-name">${p.name}</div>
          <div class="prod-sub">${p.sub}</div>
        </div>
        <div class="badges">
          <span class="badge b-green">${p.retorno}</span>
          <span class="badge b-purple">${p.honorario}</span>
        </div>
        <span class="chev">▾</span>
      </div>
      <div class="prod-body">
        <div class="joinville-box">
          <div class="jv-label"><i class="ti ti-building-factory-2" aria-hidden="true" style="font-size:12px;margin-right:4px"></i>Contexto Joinville</div>
          <div class="jv-text">${p.joinville}</div>
        </div>
        <div class="body-grid">
          <div class="body-box">
            <div class="box-label">Como executar</div>
            <div class="box-text"><ul>${como}</ul></div>
          </div>
          <div class="body-box">
            <div class="box-label">Métricas do produto</div>
            <div class="meter-row"><span class="meter-label">Velocidade de caixa</span><div class="meter-bar">${scoreBar(p.scores.velocidade,"fill-teal")}</div><span class="meter-val">${p.scores.velocidade}/5</span></div>
            <div class="meter-row"><span class="meter-label">Facilidade de entrada</span><div class="meter-bar">${scoreBar(p.scores.entrada,"fill-purple")}</div><span class="meter-val">${p.scores.entrada}/5</span></div>
            <div class="meter-row"><span class="meter-label">Ticket do produto</span><div class="meter-bar">${scoreBar(p.scores.ticket,"fill-amber")}</div><span class="meter-val">${p.scores.ticket}/5</span></div>
            ${p.pitch?`<div style="margin-top:10px;padding-top:10px;border-top:0.5px solid var(--color-border-tertiary)"><div class="box-label">Pitch de abordagem</div><div class="box-text" style="font-style:italic">"${p.pitch}"</div></div>`:""}
          </div>
        </div>
        <div class="escalada-box">
          <div class="esc-label"><i class="ti ti-stairs-up" aria-hidden="true" style="font-size:12px;margin-right:4px"></i>Escada para o mandato estratégico</div>
          <div class="esc-steps">${steps}</div>
        </div>
        <button class="ask-btn" onclick="event.stopPropagation();sendPrompt('Quero montar uma proposta comercial e um pitch de abordagem para o produto de ${p.name} voltado para empresas industriais de Joinville. Como estruturar a oferta, o modelo de honorários e a apresentação?')">Montar proposta para este produto ↗</button>
      </div>
    </div>`;
  }).join("");
}

render();
</script>
