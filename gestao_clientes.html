<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLA — Gestão de Clientes</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeedea;
  --bd:#e7e5e0;--bd2:#d1cfc8;
  --t1:#1c1a17;--t2:#6b6860;--t3:#9b9891;
  --r-lg:10px;--r-md:6px;--r-sm:4px;
  --color-background-primary:var(--bg);
  --color-background-secondary:var(--bg2);
  --color-border-tertiary:var(--bd);
  --color-border-secondary:var(--bd2);
  --color-text-primary:var(--t1);
  --color-text-secondary:var(--t2);
  --color-text-tertiary:var(--t3);
  --border-radius-lg:var(--r-lg);
  --border-radius-md:var(--r-md);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1)}

/* ── App shell ── */
.app-shell{display:flex;height:100vh;overflow:hidden}

/* ── Clients sidebar ── */
.cs{width:220px;flex-shrink:0;display:flex;flex-direction:column;background:var(--bg2);border-right:0.5px solid var(--bd)}
.cs-top{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px;border-bottom:0.5px solid var(--bd);flex-shrink:0}
.cs-title{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.cs-add{width:24px;height:24px;border-radius:5px;border:0.5px solid var(--bd2);background:var(--bg);color:var(--t2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.cs-add:hover{background:var(--bg3)}
.cs-list{flex:1;overflow-y:auto}
.cs-item{padding:9px 12px;cursor:pointer;border-bottom:0.5px solid var(--bd);transition:background .12s;border-left:2px solid transparent}
.cs-item:hover{background:var(--bg)}
.cs-item.active{background:var(--bg);border-left-color:#534AB7}
.cs-name{font-size:12px;font-weight:500;color:var(--t1);line-height:1.3}
.cs-meta{font-size:10px;color:var(--t3);margin-top:2px}
.cs-dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.cs-dot{width:7px;height:7px;border-radius:50%}
.dot-prospect{background:#BA7517}
.dot-andamento{background:#534AB7}
.dot-concluido{background:#1D9E75}
.cs-empty{padding:20px 12px;font-size:11px;color:var(--t3);text-align:center;line-height:1.7}

/* ── Main content ── */
.app-content{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px}
.empty-icon{font-size:36px;opacity:.25}
.empty-title{font-size:14px;font-weight:500;color:var(--t2)}
.empty-sub{font-size:12px;color:var(--t3)}
.empty-btn{margin-top:8px;font-size:12px;padding:7px 16px;border-radius:var(--r-md);border:0.5px solid var(--bd2);background:var(--bg);color:var(--t1);cursor:pointer}
.empty-btn:hover{background:var(--bg2)}

/* Client header */
.client-header{padding:14px 18px 12px;border-bottom:0.5px solid var(--bd);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0;background:var(--bg)}
.ch-name{font-size:16px;font-weight:600;color:var(--t1);margin-bottom:5px}
.ch-info{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ch-chip{font-size:11px;color:var(--t2);display:flex;align-items:center;gap:4px}
.ch-chip svg{flex-shrink:0;opacity:.7}
.ch-website{font-size:11px;color:#534AB7;text-decoration:none;display:flex;align-items:center;gap:3px}
.ch-website:hover{text-decoration:underline}
.ch-notes{font-size:11px;color:var(--t3);font-style:italic;margin-top:6px;line-height:1.5}
.ch-actions{display:flex;gap:6px;flex-shrink:0;margin-top:2px}
.btn-icon{padding:5px 10px;font-size:11px;border-radius:var(--r-md);border:0.5px solid var(--bd2);background:transparent;color:var(--t2);cursor:pointer}
.btn-icon:hover{background:var(--bg2);color:var(--t1)}

/* Products scrollable area */
.products-area{flex:1;overflow-y:auto;padding:14px 18px}

/* Phase nav */
.phase-nav{display:flex;gap:0;margin-bottom:14px;border:0.5px solid var(--bd2);border-radius:var(--r-md);overflow:hidden}
.pn{flex:1;padding:8px 10px;font-size:11px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--t2);border:none;border-right:0.5px solid var(--bd2);transition:all .15s;text-align:center;line-height:1.3}
.pn:last-child{border-right:none}
.pn.on{background:var(--t1);color:var(--bg)}
.section-intro{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:14px;padding:10px 14px;background:var(--bg2);border-radius:var(--r-md);border-left:3px solid #534AB7}

/* Product cards */
.products-list{display:flex;flex-direction:column;gap:10px}
.prod{border:0.5px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:border-color .15s}
.prod:hover{border-color:var(--bd2)}
.prod.open{border-color:#534AB7}
.prod-head{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px;padding:11px 14px;background:var(--bg2)}
.prod-name{font-size:13px;font-weight:500;color:var(--t1);line-height:1.3}
.prod-sub{font-size:11px;color:var(--t2);margin-top:2px;font-weight:400}
.badges{display:flex;gap:4px;flex-direction:column;align-items:flex-end}
.badge{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:500;white-space:nowrap}
.b-green{background:#E1F5EE;color:#085041}
.b-purple{background:#EEEDFE;color:#3C3489}
.b-amber{background:#FAEEDA;color:#633806}
.b-coral{background:#FAECE7;color:#712B13}
.b-gray{background:var(--bg);border:0.5px solid var(--bd2);color:var(--t2)}
.chev{font-size:11px;color:var(--t3);transition:transform .2s;user-select:none}
.prod.open .chev{transform:rotate(180deg)}
.prod-status-pill{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:500;white-space:nowrap}
.sp-prospect{background:#FAEEDA;color:#633806}
.sp-andamento{background:#EEEDFE;color:#3C3489}
.sp-concluido{background:#E1F5EE;color:#085041}

/* Product body */
.prod-body{display:none;padding:14px 14px;border-top:0.5px solid var(--bd)}
.prod.open .prod-body{display:block}
.body-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.body-box{background:var(--bg2);border-radius:var(--r-md);padding:10px 12px}
.box-label{font-size:10px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.box-text{font-size:11px;color:var(--t2);line-height:1.55}
.box-text li{margin-left:14px;margin-bottom:3px}
.joinville-box{background:#EEEDFE;border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px}
.jv-label{font-size:10px;color:#3C3489;font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.jv-text{font-size:11px;color:#3C3489;line-height:1.55}
.escalada-box{border:0.5px solid var(--bd);border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px}
.esc-label{font-size:10px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.esc-steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.esc-step{font-size:11px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--bd2);color:var(--t2);background:var(--bg)}
.esc-arrow{font-size:12px;color:var(--t3)}
.esc-step.highlight{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.meter-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.meter-label{font-size:11px;color:var(--t2);width:110px;flex-shrink:0}
.meter-bar{flex:1;height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
.meter-fill{height:100%;border-radius:3px}
.fill-purple{background:#534AB7}
.fill-teal{background:#1D9E75}
.fill-amber{background:#BA7517}
.meter-val{font-size:11px;color:var(--t3);width:28px;text-align:right}

/* Pitch box */
.pitch-sep{margin-top:10px;padding-top:10px;border-top:0.5px solid var(--bd)}

/* Product action row */
.prod-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:0.5px solid var(--bd);gap:8px;flex-wrap:wrap}
.status-group{display:flex;gap:4px;flex-wrap:wrap}
.status-btn{font-size:10px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--bd2);background:var(--bg);color:var(--t2);cursor:pointer;transition:all .15s}
.status-btn:hover{background:var(--bg2)}
.status-btn.s-prospect{background:#FAEEDA;color:#633806;border-color:#BA7517}
.status-btn.s-andamento{background:#EEEDFE;color:#3C3489;border-color:#534AB7}
.status-btn.s-concluido{background:#E1F5EE;color:#085041;border-color:#1D9E75}
.steps-btn{font-size:11px;padding:5px 12px;border-radius:var(--r-md);border:0.5px solid var(--bd2);background:transparent;color:var(--t2);cursor:pointer;white-space:nowrap}
.steps-btn:hover{background:var(--bg2);color:var(--t1)}

/* ── Client modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--bg);border-radius:var(--r-lg);width:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 64px);display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.18)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:0.5px solid var(--bd);flex-shrink:0}
.modal-head-title{font-size:14px;font-weight:600;color:var(--t1)}
.modal-x{width:26px;height:26px;border:none;background:transparent;color:var(--t3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px;line-height:1}
.modal-x:hover{background:var(--bg2);color:var(--t1)}
.modal-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.form-row{display:flex;flex-direction:column;gap:4px}
.form-row label{font-size:11px;font-weight:500;color:var(--t2)}
.form-row input,.form-row textarea{font-size:12px;padding:7px 10px;border:0.5px solid var(--bd2);border-radius:var(--r-md);background:var(--bg2);color:var(--t1);font-family:inherit;outline:none;resize:vertical;transition:border-color .15s}
.form-row input:focus,.form-row textarea:focus{border-color:#534AB7;background:var(--bg)}
.form-row textarea{min-height:60px}
.modal-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:0.5px solid var(--bd);flex-shrink:0}
.btn-primary{font-size:12px;padding:7px 16px;border-radius:var(--r-md);border:none;background:#534AB7;color:#fff;cursor:pointer;font-weight:500}
.btn-primary:hover{background:#3C3489}
.btn-secondary{font-size:12px;padding:7px 14px;border-radius:var(--r-md);border:0.5px solid var(--bd2);background:transparent;color:var(--t2);cursor:pointer}
.btn-secondary:hover{background:var(--bg2)}
.btn-danger{font-size:12px;padding:7px 14px;border-radius:var(--r-md);border:0.5px solid #f5c4b8;background:#FAECE7;color:#712B13;cursor:pointer}
.btn-danger:hover{background:#f8d8cf}

/* ── Steps full-screen overlay ── */
.steps-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column}
.steps-topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:0.5px solid var(--bd);flex-shrink:0;background:var(--bg)}
.steps-back{font-size:12px;padding:5px 12px;border-radius:var(--r-md);border:0.5px solid var(--bd2);background:transparent;color:var(--t2);cursor:pointer}
.steps-back:hover{background:var(--bg2)}
.steps-topbar-title{font-size:13px;font-weight:500;color:var(--t1)}

/* Passo a passo inner layout */
.pa-wrap{display:grid;grid-template-columns:210px 1fr;flex:1;overflow:hidden}
.pa-sb{background:var(--bg2);border-right:0.5px solid var(--bd);overflow-y:auto}
.pa-ph-label{font-size:9px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px 4px}
.pa-sb-item{padding:8px 12px;cursor:pointer;border-bottom:0.5px solid var(--bd);transition:background .12s;border-left:2px solid transparent}
.pa-sb-item:hover{background:var(--bg)}
.pa-sb-item.active{background:var(--bg);border-left-color:#534AB7}
.pa-sb-name{font-size:12px;font-weight:500;color:var(--t1);line-height:1.3}
.pa-sb-tag{font-size:10px;color:var(--t3);margin-top:2px}
.pa-main{overflow-y:auto;padding:16px 18px}
.pa-prod-title{font-size:15px;font-weight:500;color:var(--t1);margin-bottom:4px}
.pa-prod-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pa-meta-badge{font-size:10px;padding:2px 9px;border-radius:6px;font-weight:500}
.pa-mb-green{background:#E1F5EE;color:#085041}
.pa-mb-purple{background:#EEEDFE;color:#3C3489}
.pa-mb-amber{background:#FAEEDA;color:#633806}
.pa-mb-coral{background:#FAECE7;color:#712B13}
.pa-steps-wrap{display:flex;flex-direction:column;gap:0}
.pa-step-row{display:grid;grid-template-columns:32px 1fr;gap:0}
.pa-step-left{display:flex;flex-direction:column;align-items:center}
.pa-step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;z-index:1}
.pa-sn-purple{background:#EEEDFE;color:#3C3489}
.pa-sn-teal{background:#E1F5EE;color:#085041}
.pa-sn-amber{background:#FAEEDA;color:#633806}
.pa-sn-coral{background:#FAECE7;color:#712B13}
.pa-step-line{flex:1;width:1px;background:var(--bd);margin:4px 0}
.pa-step-row:last-child .pa-step-line{display:none}
.pa-step-card{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r-md);padding:10px 12px;margin-bottom:10px;margin-left:8px}
.pa-step-heading{font-size:12px;font-weight:500;color:var(--t1);margin-bottom:4px}
.pa-step-desc{font-size:11px;color:var(--t2);line-height:1.6;margin-bottom:6px}
.pa-step-meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pa-sm{font-size:10px;padding:2px 8px;border-radius:5px;background:var(--bg2);border:0.5px solid var(--bd);color:var(--t2)}
.pa-entregavel{background:var(--bg2);border-radius:6px;padding:6px 10px;margin-top:6px}
.pa-ent-label{font-size:9px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.pa-ent-item{font-size:11px;color:var(--t2);line-height:1.5}
.pa-ent-item::before{content:"→ ";color:var(--t3)}
.pa-next-box{margin-top:16px;padding:10px 14px;background:#EEEDFE;border-radius:var(--r-md)}
.pa-next-label{font-size:10px;font-weight:500;color:#3C3489;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.pa-next-text{font-size:12px;color:#3C3489;line-height:1.55}
.pa-flag-box{background:#FAECE7;border-radius:var(--r-md);padding:8px 12px;margin-top:8px}
.pa-flag-label{font-size:9px;font-weight:500;color:#712B13;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.pa-flag-text{font-size:11px;color:#712B13;line-height:1.55}
</style>
</head>
<body>

<div class="app-shell">
  <!-- Clients sidebar -->
  <aside class="cs">
    <div class="cs-top">
      <span class="cs-title">Clientes</span>
      <button class="cs-add" onclick="openClientModal()" title="Adicionar cliente">+</button>
    </div>
    <div class="cs-list" id="cs-list"></div>
  </aside>

  <!-- Main content -->
  <div class="app-content" id="app-content">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🏢</div>
      <div class="empty-title">Nenhum cliente selecionado</div>
      <div class="empty-sub">Selecione um cliente ou adicione um novo</div>
      <button class="empty-btn" onclick="openClientModal()">+ Adicionar cliente</button>
    </div>
    <div id="client-view" style="display:none;flex:1;display:none;flex-direction:column;height:100%">
      <div class="client-header" id="client-header"></div>
      <div class="products-area" id="products-area"></div>
    </div>
  </div>
</div>

<!-- Client add/edit modal -->
<div class="modal-bg" id="client-modal" style="display:none" onclick="closeClientModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <span class="modal-head-title" id="modal-title">Novo cliente</span>
      <button class="modal-x" onclick="closeClientModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row"><label>Nome da empresa *</label><input id="f-name" type="text" placeholder="Ex: Tupy S.A."></div>
      <div class="form-row"><label>Contato</label><input id="f-contact" type="text" placeholder="Nome do CFO, controller..."></div>
      <div class="form-row"><label>E-mail</label><input id="f-email" type="email" placeholder="contato@empresa.com.br"></div>
      <div class="form-row"><label>Telefone</label><input id="f-phone" type="tel" placeholder="+55 47 9 0000-0000"></div>
      <div class="form-row"><label>Website</label><input id="f-website" type="url" placeholder="https://empresa.com.br"></div>
      <div class="form-row"><label>Setor</label><input id="f-sector" type="text" placeholder="Metalurgia, plástico, têxtil..."></div>
      <div class="form-row"><label>Notas</label><textarea id="f-notes" placeholder="Observações, contexto, próximos passos..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn-danger" id="modal-delete-btn" onclick="deleteActiveClient()" style="display:none">Remover cliente</button>
      <div style="display:flex;gap:8px">
        <button class="btn-secondary" onclick="closeClientModal()">Cancelar</button>
        <button class="btn-primary" onclick="saveClientFromModal()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- Step-by-step overlay -->
<div class="steps-overlay" id="steps-overlay" style="display:none">
  <div class="steps-topbar">
    <button class="steps-back" onclick="closeStepsOverlay()">← Voltar</button>
    <span class="steps-topbar-title" id="steps-overlay-title">Passo a passo</span>
  </div>
  <div class="pa-wrap">
    <div class="pa-sb" id="pa-sb"></div>
    <div class="pa-main" id="pa-main"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════
   DATA — Phases & products
   ════════════════════════════════════════ */
const phases = [
  {
    label:"Fase 1 — Porta de entrada",
    intro:"Produtos de resultado imediato e mensurável para o cliente — vendem-se sozinhos porque o ROI é claro antes mesmo de a proposta ser assinada. O objetivo não é o honorário desse produto: é a cadeira na sala de reunião.",
    products:[
      {
        name:"Recuperação de créditos tributários",
        sub:"PIS/COFINS, ICMS-ST, INSS sobre verbas indenizatórias",
        retorno:"Imediato (30–120 dias)",honorario:"25–35% sobre recuperado",
        joinville:"Tupy, Tigre, Embraco/Nidec, Döhler, WEG: empresas de Lucro Real com folha e importação elevadas. Potencial de recuperação de R$500k a R$50M+ dependendo do porte e do tempo de prescrição.",
        escalada:["Recuperação tributária","Due diligence tributária","Consultoria tributária preventiva","Planejamento tributário estrutural"],escaladaIdx:0,
        como:["Tese do Século (ICMS da base PIS/COFINS): apesar de consolidada, muitas empresas ainda não executaram o crédito","INSS sobre verbas indenizatórias (aviso prévio indenizado, férias proporcionais): tese consolidada no STJ","ICMS-ST pago a maior: recuperável nos últimos 5 anos via levantamento de notas","PIS/COFINS sobre insumos (conceito expandido pelo STJ): indústria de Joinville tem alto potencial"],
        pitch:"Antes de assinar qualquer contrato, entrego um diagnóstico tributário gratuito de 30 dias. Se não encontrar nada, você não paga nada.",
        scores:{velocidade:5,entrada:5,ticket:3},stepsIdx:0
      },
      {
        name:"Revisão de classificação fiscal (NCM)",
        sub:"Redução de II, IPI, PIS/COFINS de importação",
        retorno:"Imediato (90–180 dias)",honorario:"20–30% sobre economia anual projetada",
        joinville:"Joinville importa máquinas, componentes e insumos industriais em volume altíssimo. Erro de NCM é comum e resulta em pagamento a maior de II e IPI — e em risco de autuação.",

let clients = JSON.parse(localStorage.getItem('mla_clients') || '[]');
let activeClientId = null;
let activePhase = 0;
let openProds = new Set();
let editingClientId = null;

function save() {
  localStorage.setItem('mla_clients', JSON.stringify(clients));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function getClient(id) {
  return clients.find(c => c.id === id);
}

  if (!clients.length) {
    list.innerHTML = '<div class="cs-empty">Nenhum cliente.<br>Clique em + para adicionar.</div>';
    return;
  }
  list.innerHTML = clients.map(c => {
    const dots = Object.values(c.products || {}).map(s => {
      if (s === 'prospect') return '<span class="cs-dot dot-prospect"></span>';
      if (s === 'andamento') return '<span class="cs-dot dot-andamento"></span>';
      if (s === 'concluido') return '<span class="cs-dot dot-concluido"></span>';
      return '';
    }).join('');
    return `<div class="cs-item${c.id === activeClientId ? ' active' : ''}" onclick="selectClient('${c.id}')">
      <div class="cs-name">${esc(c.name)}</div>
      ${c.sector ? `<div class="cs-meta">${esc(c.sector)}</div>` : ''}
      ${dots ? `<div class="cs-dots">${dots}</div>` : ''}
    </div>`;
  }).join('');
}

function selectClient(id) {
  activeClientId = id;
  activePhase = 0;
  openProds = new Set();
  renderClientsList();
  renderClientView();
}

/* ════════════════════════════════════════
   CLIENT VIEW
   ════════════════════════════════════════ */
function renderClientView() {
  const empty = document.getElementById('empty-state');
  const view = document.getElementById('client-view');

  if (!activeClientId) {
    empty.style.display = 'flex';
    view.style.display = 'none';
    return;
  }

  const c = getClient(activeClientId);
  if (!c) return;

  empty.style.display = 'none';
  view.style.display = 'flex';
  view.style.flexDirection = 'column';
  view.style.height = '100%';

  // Header
  const websiteHtml = c.website
    ? `<a class="ch-website" href="${esc(c.website)}" target="_blank" rel="noopener">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        ${esc(c.website.replace(/^https?:\/\//, ''))}
      </a>` : '';

  const chips = [
    c.contact ? `<span class="ch-chip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${esc(c.contact)}</span>` : '',
    c.email ? `<span class="ch-chip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>${esc(c.email)}</span>` : '',
    c.phone ? `<span class="ch-chip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6.06 6.06l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21.61 16.92z"/></svg>${esc(c.phone)}</span>` : '',
    websiteHtml,
  ].filter(Boolean).join('');

  document.getElementById('client-header').innerHTML = `
    <div class="ch-left">
      <div class="ch-name">${esc(c.name)}</div>
      ${chips ? `<div class="ch-info">${chips}</div>` : ''}
      ${c.notes ? `<div class="ch-notes">${esc(c.notes)}</div>` : ''}
    </div>
    <div class="ch-actions">
      <button class="btn-icon" onclick="openClientModal('${c.id}')">Editar</button>
    </div>`;

  // Products
  renderProducts();
}

/* ════════════════════════════════════════
   PRODUCTS RENDER
   ════════════════════════════════════════ */
function renderProducts() {
  const area = document.getElementById('products-area');
  const c = getClient(activeClientId);
  if (!c) return;

  const phase = phases[activePhase];

  const phaseNav = `<div class="phase-nav">
    ${phases.map((p,i) => `<button class="pn${i===activePhase?' on':''}" onclick="switchPhase(${i})">${p.label.replace('Fase 1','F1').replace('Fase 2','F2').replace('Fase 3','F3')}</button>`).join('')}
  </div>`;

  const prodCards = phase.products.map((p, pi) => {
    const key = `${activePhase}-${pi}`;
    const isOpen = openProds.has(key);
    const status = (c.products || {})[key];

    const statusPill = status
      ? `<span class="prod-status-pill sp-${status}">${statusLabel(status)}</span>`
      : '';

    const escalada = p.escalada.map((s,si) =>
      `<span class="esc-step${si===p.escaladaIdx?' highlight':''}">${s}</span>${si<p.escalada.length-1?'<span class="esc-arrow">→</span>':''}`
    ).join('');

    const como = p.como.map(c => `<li>${c}</li>`).join('');

    const pitch = p.pitch ? `<div class="pitch-sep"><div class="box-label">Pitch de abordagem</div><div class="box-text" style="font-style:italic">"${p.pitch}"</div></div>` : '';

    const statusBtns = ['prospect','andamento','concluido'].map(s =>
      `<button class="status-btn${status===s?' s-'+s:''}" onclick="event.stopPropagation();setProductStatus('${key}','${status===s?'':s}')">${statusLabel(s)}</button>`
    ).join('');

    return `<div class="prod${isOpen?' open':''}" onclick="toggleProd('${key}')">
      <div class="prod-head">
        <div>
          <div class="prod-name">${p.name}</div>
          <div class="prod-sub">${p.sub}</div>
        </div>
        <div class="badges">
          <span class="badge b-green">${p.retorno}</span>
          <span class="badge b-purple">${p.honorario}</span>
        </div>
        ${statusPill}
        <span class="chev">▾</span>
      </div>
      <div class="prod-body">
        <div class="joinville-box">
          <div class="jv-label">Contexto Joinville</div>
          <div class="jv-text">${p.joinville}</div>
        </div>
        <div class="body-grid">
          <div class="body-box">
            <div class="box-label">Como executar</div>
            <div class="box-text"><ul>${como}</ul></div>
          </div>
          <div class="body-box">
            <div class="box-label">Métricas do produto</div>
            <div class="meter-row"><span class="meter-label">Velocidade de caixa</span><div class="meter-bar"><div class="meter-fill fill-teal" style="width:${p.scores.velocidade/5*100}%"></div></div><span class="meter-val">${p.scores.velocidade}/5</span></div>
            <div class="meter-row"><span class="meter-label">Facilidade de entrada</span><div class="meter-bar"><div class="meter-fill fill-purple" style="width:${p.scores.entrada/5*100}%"></div></div><span class="meter-val">${p.scores.entrada}/5</span></div>
            <div class="meter-row"><span class="meter-label">Ticket do produto</span><div class="meter-bar"><div class="meter-fill fill-amber" style="width:${p.scores.ticket/5*100}%"></div></div><span class="meter-val">${p.scores.ticket}/5</span></div>
            ${pitch}
          </div>
        </div>
        <div class="escalada-box">
          <div class="esc-label">Escada para o mandato estratégico</div>
          <div class="esc-steps">${escalada}</div>
        </div>
        <div class="prod-actions">
          <div>
            <div class="box-label" style="margin-bottom:6px">Status neste cliente</div>
            <div class="status-group">${statusBtns}</div>
          </div>
          <button class="steps-btn" onclick="event.stopPropagation();openSteps(${p.stepsIdx})">Ver passo a passo ↗</button>
        </div>
      </div>
    </div>`;
  }).join('');

  area.innerHTML = phaseNav +
    `<div class="section-intro">${phase.intro}</div>` +
    `<div class="products-list">${prodCards}</div>`;
}

function switchPhase(idx) {
  activePhase = idx;
  openProds = new Set();
  renderProducts();
}

function toggleProd(key) {
  if (openProds.has(key)) openProds.delete(key);
  else openProds.add(key);
  renderProducts();
}

function setProductStatus(key, status) {
  const c = getClient(activeClientId);
  if (!c) return;
  if (!c.products) c.products = {};
  if (status === '') delete c.products[key];
  else c.products[key] = status;
  save();
  renderClientsList();
  renderProducts();
}

function statusLabel(s) {
  return {prospect:'Prospectando',andamento:'Em andamento',concluido:'Concluído'}[s] || s;
}

/* ════════════════════════════════════════
   CLIENT MODAL (add / edit)
   ════════════════════════════════════════ */
function openClientModal(id) {
  editingClientId = id || null;
  const c = id ? getClient(id) : null;
  document.getElementById('modal-title').textContent = c ? 'Editar cliente' : 'Novo cliente';
  document.getElementById('f-name').value = c?.name || '';
  document.getElementById('f-contact').value = c?.contact || '';
  document.getElementById('f-email').value = c?.email || '';
  document.getElementById('f-phone').value = c?.phone || '';
  document.getElementById('f-website').value = c?.website || '';
  document.getElementById('f-sector').value = c?.sector || '';
  document.getElementById('f-notes').value = c?.notes || '';
  document.getElementById('modal-delete-btn').style.display = c ? 'block' : 'none';
  document.getElementById('client-modal').style.display = 'flex';
  document.getElementById('f-name').focus();
}

function closeClientModal() {
  document.getElementById('client-modal').style.display = 'none';
  editingClientId = null;
}

function saveClientFromModal() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { document.getElementById('f-name').focus(); return; }

  const data = {
    name,
    contact: document.getElementById('f-contact').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    website: normalizeUrl(document.getElementById('f-website').value.trim()),
    sector: document.getElementById('f-sector').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
  };

  if (editingClientId) {
    const c = getClient(editingClientId);
    Object.assign(c, data);
  } else {
    const newClient = { id: uid(), products: {}, createdAt: new Date().toISOString(), ...data };
    clients.push(newClient);
    activeClientId = newClient.id;
  }

  save();
  closeClientModal();
  renderClientsList();
  renderClientView();
}

function deleteActiveClient() {
  if (!editingClientId) return;
  if (!confirm('Remover este cliente? Esta ação não pode ser desfeita.')) return;
  clients = clients.filter(c => c.id !== editingClientId);
  if (activeClientId === editingClientId) activeClientId = null;
  save();
  closeClientModal();
  renderClientsList();
  renderClientView();
}

function normalizeUrl(url) {
  if (!url) return '';
  if (!/^https?:\/\//i.test(url)) return 'https://' + url;
  return url;
}

/* ════════════════════════════════════════
   STEPS OVERLAY (passo a passo)
   ════════════════════════════════════════ */
let activeStepIdx = 0;

function openSteps(idx) {
  activeStepIdx = idx;
  document.getElementById('steps-overlay').style.display = 'flex';
  document.getElementById('steps-overlay-title').textContent = stepsData[idx].name;
  renderStepsSidebar();
  renderStepsMain();
}

function closeStepsOverlay() {
  document.getElementById('steps-overlay').style.display = 'none';
}

function renderStepsSidebar() {
  let html = '';
  let lastPhase = '';
  stepsData.forEach((p, i) => {
    if (p.phase !== lastPhase) {
      lastPhase = p.phase;
      const label = p.phase.replace('Fase 1','F1 — Porta de entrada').replace('Fase 2','F2 — Aprofundamento').replace('Fase 3','F3 — Mandato estratégico');
      html += `<div class="pa-ph-label">${label}</div>`;
    }
    html += `<div class="pa-sb-item${i===activeStepIdx?' active':''}" onclick="selectStep(${i})">
      <div class="pa-sb-name">${p.name}</div>
      <div class="pa-sb-tag">${p.tag}</div>
    </div>`;
  });
  document.getElementById('pa-sb').innerHTML = html;
}

function selectStep(idx) {
  activeStepIdx = idx;
  document.getElementById('steps-overlay-title').textContent = stepsData[idx].name;
  renderStepsSidebar();
  renderStepsMain();
  document.getElementById('pa-main').scrollTop = 0;
}

function renderStepsMain() {
  const p = stepsData[activeStepIdx];

  const steps = p.steps.map((s, si) => {
    const ent = s.entregaveis
      ? `<div class="pa-entregavel"><div class="pa-ent-label">Entregáveis</div>${s.entregaveis.map(e=>`<div class="pa-ent-item">${e}</div>`).join('')}</div>` : '';
    const metas = s.metas
      ? `<div class="pa-entregavel" style="margin-top:6px"><div class="pa-ent-label">Critério de sucesso</div>${s.metas.map(m=>`<div class="pa-ent-item">${m}</div>`).join('')}</div>` : '';
    const flag = s.flag
      ? `<div class="pa-flag-box"><div class="pa-flag-label">Atenção</div><div class="pa-flag-text">${s.flag}</div></div>` : '';

    return `<div class="pa-step-row">
      <div class="pa-step-left">
        <div class="pa-step-num ${s.color}">${s.n}</div>
        ${si < p.steps.length - 1 ? '<div class="pa-step-line"></div>' : ''}
      </div>
      <div class="pa-step-card">
        <div class="pa-step-heading">${s.title} <span style="font-size:10px;color:var(--t3);font-weight:400;margin-left:4px">${s.prazo}</span></div>
        <div class="pa-step-desc">${s.desc}</div>
        ${ent}${metas}${flag}
      </div>
    </div>`;
  }).join('');

  document.getElementById('pa-main').innerHTML = `
    <div class="pa-prod-title">${p.name}</div>
    <div class="pa-prod-meta">
      <span class="pa-meta-badge pa-mb-green">${p.retorno}</span>
      <span class="pa-meta-badge pa-mb-purple">${p.honorario}</span>
      <span class="pa-meta-badge pa-mb-amber">Dificuldade: ${p.dificuldade}</span>
    </div>
    <div class="pa-steps-wrap">${steps}</div>
    <div class="pa-next-box">
      <div class="pa-next-label">Próximo produto nesta escada</div>
      <div class="pa-next-text"><strong>${p.nextProduct}</strong> — ${p.nextReason}</div>
    </div>`;
}

/* ════════════════════════════════════════
   UTILS
   ════════════════════════════════════════ */
function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* keyboard: Escape closes modals/overlay */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('steps-overlay').style.display !== 'none') { closeStepsOverlay(); return; }
    if (document.getElementById('client-modal').style.display !== 'none') { closeClientModal(); return; }
  }
});

/* ════════════════════════════════════════
   INIT
   ════════════════════════════════════════ */
renderClientsList();
renderClientView();
</script>
</body>
</html>
