let active=0;

function buildSb(){
  const sb=document.getElementById("sb");
  let html="";
  let phase="";
  products.forEach((p,i)=>{
    if(p.phase!==phase){
      phase=p.phase;
      const col=p.phaseColor;
      const label=phase.replace("Fase 1","F1").replace("Fase 2","F2").replace("Fase 3","F3");
      html+=`<div class="ph-label">${label}</div>`;
    }
    html+=`<div class="sb-item${i===active?" active":""}" onclick="select(${i})"><div class="sb-name">${p.name}</div><div class="sb-tag">${p.tag}</div></div>`;
  });
  sb.innerHTML=html;
}

function buildMain(){
  const p=products[active];
  const stepNums=p.steps.length;
  const steps=p.steps.map((s,si)=>{
    const ent=s.entregaveis?s.entregaveis.map(e=>`<div class="ent-item">${e}</div>`).join(""):"";
    const metas=s.metas?s.metas.map(m=>`<div class="ent-item">${m}</div>`).join(""):"";
    const flag=s.flag?`<div class="flag-box"><div class="flag-label">Atenção</div><div class="flag-text">${s.flag}</div></div>`:"";
    return `<div class="step-row">
      <div class="step-left">
        <div class="step-num ${s.color}">${s.n}</div>
        ${si<stepNums-1?'<div class="step-line"></div>':""}
      </div>
      <div class="step-card">
        <div class="step-heading">${s.title} <span style="font-size:10px;color:var(--color-text-tertiary);font-weight:400;margin-left:4px">${s.prazo}</span></div>
        <div class="step-desc">${s.desc}</div>
        ${ent?`<div class="entregavel"><div class="ent-label">Entregáveis</div>${ent}</div>`:""}
        ${metas?`<div class="entregavel" style="margin-top:6px"><div class="ent-label">Critério de sucesso</div>${metas}</div>`:""}
        ${flag}
      </div>
    </div>`;
  }).join("");
  document.getElementById("main").innerHTML=`
    <div class="prod-title">${p.name}</div>
    <div class="prod-meta">
      <span class="meta-badge mb-green">${p.retorno}</span>
      <span class="meta-badge mb-purple">${p.honorario}</span>
      <span class="meta-badge mb-amber">Dificuldade: ${p.dificuldade}</span>
    </div>
    <div class="steps-wrap">${steps}</div>
    <div class="next-box">
      <div class="next-label">Próximo produto nesta escada</div>
      <div class="next-text"><strong>${p.nextProduct}</strong> — ${p.nextReason}</div>
    </div>
    <button class="ask-btn" onclick="sendPrompt('Me ajude a montar um modelo de proposta comercial e contrato de honorários para o produto de ${p.name}. Quero o escopo, o modelo de remuneração e as cláusulas mais importantes.')">Montar proposta e contrato de honorários para este produto ↗</button>`;
}

function select(i){
  active=i;
  buildSb();
  buildMain();
  document.getElementById("main").scrollTop=0;
}

buildSb();
buildMain();
</script>
