let activeCat = cats[0].id;

function renderSidebar(){
  const sb=document.getElementById("sidebar");
  sb.innerHTML=cats.map(c=>`
    <div class="sidebar-item${c.id===activeCat?" active":""}" onclick="selectCat('${c.id}')">
      <span class="cat-icon">${c.icon}</span>
      <span class="cat-name">${c.name}</span>
      <span class="cat-count">${c.clauses.length}</span>
    </div>`).join("");
}

function selectCat(id){
  activeCat=id;
  document.getElementById("search").value="";
  renderSidebar();
  const cat=cats.find(c=>c.id===id);
  document.getElementById("main-title").textContent=cat.icon+" "+cat.name;
  document.getElementById("main-desc").textContent=cat.desc;
  renderClauses(cat.clauses);
}

function renderClauses(clauses){
  const area=document.getElementById("clauses-area");
  if(!clauses.length){area.innerHTML='<div class="empty">Nenhuma cláusula encontrada.</div>';return;}
  area.innerHTML=clauses.map((cl,i)=>{
    const pl={max:"🔴 Blindagem máxima",high:"🟡 Alta proteção",med:"🟢 Complementar"}[cl.power];
    const pc={max:"p-max",high:"p-high",med:"p-med"}[cl.power];
    const tips=(cl.tips||[]).map(t=>`<span class="tip">✓ ${t}</span>`).join("");
    const flags=(cl.flags||[]).map(f=>`<span class="flag">⚠ ${f}</span>`).join("");
    return `<div class="clause-card" id="cl-${i}" onclick="toggleClause(${i})">
      <div class="clause-head">
        <span class="clause-name">${cl.name}</span>
        <span class="power ${pc}">${pl}</span>
        <span class="chev">▾</span>
      </div>
      <div class="clause-body">
        <div class="section-label">Texto-modelo</div>
        <button class="copy-btn" onclick="event.stopPropagation();copyText(${i})">Copiar</button>
        <div class="clause-text" id="ct-${i}">${cl.text.trim()}</div>
        <div class="section-label" style="margin-top:12px">Por que é estratégica</div>
        <div class="note">${cl.why}</div>
        ${tips?`<div class="section-label" style="margin-top:10px">Como redigir bem</div><div class="tip-row">${tips}</div>`:""}
        ${flags?`<div class="section-label" style="margin-top:10px">Atenção</div><div class="tip-row">${flags}</div>`:""}
      </div>
    </div>`;
  }).join("");
}

function toggleClause(i){
  const el=document.getElementById("cl-"+i);
  el.classList.toggle("open");
}

function copyText(i){
  const el=document.getElementById("ct-"+i);
  navigator.clipboard.writeText(el.textContent.trim()).then(()=>{
    const btn=el.previousElementSibling;
    btn.textContent="Copiado ✓";
    setTimeout(()=>{btn.textContent="Copiar"},2000);
  });
}

function doSearch(q){
  q=q.toLowerCase().trim();
  if(!q){selectCat(activeCat);return;}
  const all=cats.flatMap(c=>c.clauses);
  const found=all.filter(cl=>
    cl.name.toLowerCase().includes(q)||
    cl.why.toLowerCase().includes(q)||
    (cl.tips||[]).some(t=>t.toLowerCase().includes(q))
  );
  document.getElementById("main-title").textContent="Resultado da busca";
  document.getElementById("main-desc").textContent=found.length+" cláusula(s) encontrada(s)";
  document.querySelectorAll(".sidebar-item").forEach(s=>s.classList.remove("active"));
  renderClauses(found);
}

selectCat(cats[0].id);
